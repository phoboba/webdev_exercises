<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Week 1, Exercise 5</title>
    <style>
        .red {
            color: red;
        }

        .yellow {
            color: yellow;
        }

        .green {
            color: green;
        }

        .blue {
            color: blue;
        }

        div {
            border: solid 2px black;
            padding: 5px;
            background-color: grey;
        }
    </style>
</head>

<body>
    <h1>Embedded CSS</h1>
    <p>This exercise relies on the &lt;style&gt; attribute to use embedded CSS.</p>
    <p>In this example, I stylized each word and made a little box!</p>
    <div>
        <p>
            <span class="red">Red</span>
            <span class="yellow">Yellow</span>
            <span class="green">Green</span>
            <span class="blue">Blue</span>
        </p>
    </div>
</body>

</html>
